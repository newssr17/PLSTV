name: Generate IPTV playlist

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */12 * * *"

permissions:
  contents: write

concurrency:
  group: iptv-${{ github.repository }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  RELEASE_TAG: playlist-latest

jobs:

  prepare:

    runs-on: ubuntu-latest

    outputs:
      cache_key: ${{ steps.cache.outputs.cache_key }}

    steps:

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate Cache Key
        id: cache
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "cache_key=iptv-${{ hashFiles('config/**/*.ini', 'config/**/*.txt', 'config/**/*.m3u') }}" \
            >> "$GITHUB_OUTPUT"

  build:

    needs: prepare

    strategy:
      fail-fast: false

      matrix:
        group:
          - china
          - hk_tw
          - global

    runs-on: ubuntu-latest

    timeout-minutes: 60

    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Cache Pipenv
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.local/share/virtualenvs
          key: pipenv-${{ runner.os }}-${{ hashFiles('Pipfile.lock') }}

      - name: Restore IPTV State
        uses: actions/cache@v4
        with:
          path: output/data
          key: state-${{ needs.prepare.outputs.cache_key }}

      - name: Install FFmpeg
        shell: bash
        run: |
          set -Eeuo pipefail

          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install Dependencies
        shell: bash
        run: |
          set -Eeuo pipefail

          python -m pip install -U pip
          python -m pip install pipenv

          if [ -f Pipfile.lock ]; then
            pipenv sync
          else
            pipenv install --deploy
          fi

      - name: Generate Playlist
        shell: bash
        run: |
          set -Eeuo pipefail

          pipenv run python scripts/build.py \
            --group "${{ matrix.group }}"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: playlist-${{ matrix.group }}
          path: output

  merge:

    needs: build

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v6

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Merge Playlists
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p final

          find artifacts -name "*.txt" \
            -exec cat {} \; \
            | sort -u \
            > final/iptv.txt

          find artifacts -name "*.m3u" \
            -exec cat {} \; \
            | sort -u \
            > final/iptv.m3u

      - name: Validate Output
        shell: bash
        run: |
          set -Eeuo pipefail

          test -s final/iptv.txt
          test -s final/iptv.m3u

          wc -l final/iptv.txt
          wc -l final/iptv.m3u

      - name: Upload Final Playlist
        uses: actions/upload-artifact@v4
        with:
          name: final-playlist
          path: final

  release:

    needs: merge

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          name: final-playlist
          path: release-assets

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail

          gh release view "${RELEASE_TAG}" \
          >/dev/null 2>&1 || \
          gh release create "${RELEASE_TAG}" \
            --title "Latest IPTV Playlist" \
            --notes "Automatically generated IPTV playlist." \
            --prerelease

      - name: Upload Release Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail

          gh release upload \
            "${RELEASE_TAG}" \
            release-assets/* \
            --clobber

  commit:

    needs: release

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: final-playlist
          path: output

      - name: Commit Playlist
        shell: bash
        run: |
          set -Eeuo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
          "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f output/*

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m \
          "chore: update IPTV playlist"

          git fetch origin

          git rebase origin/${GITHUB_REF_NAME} || {
            git rebase --abort
            git reset --hard origin/${GITHUB_REF_NAME}
          }

          git push

  cleanup:

    needs: release

    runs-on: ubuntu-latest

    if: always()

    steps:

      - name: Cleanup Temp Files
        run: |
          rm -rf artifacts || true
          rm -rf release-assets || true
