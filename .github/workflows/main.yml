name: Generate playlist automatically

on:
  schedule:
    # 每天北京时间 08:00 运行（UTC 00:00）
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pipenv"

      - name: Install Pipenv
        run: python -m pip install --upgrade pipenv

      - name: Install dependencies
        run: pipenv install --dev

      - name: Generate playlist
        run: pipenv run dev

      - name: Check generated result
        run: |
          test -f output/result.m3u
          test -f output/result.txt
          echo "Generated:"
          ls -lh output/result.m3u output/result.txt

      - name: Commit and push result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/result.m3u output/result.txt

          if git diff --cached --quiet; then
            echo "No changes to result files."
            exit 0
          fi

          git commit -m "chore: update IPTV playlist"
          git push
