name: Generate IPTV playlist

on:
  schedule:
    # 每天北京时间 08:00（GitHub Actions 使用 UTC）
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: iptv-playlist-${{ github.repository }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pipenv

      - name: Install Pipenv and dependencies
        run: |
          python -m pip install --upgrade pip pipenv
          pipenv install --dev

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Check FFmpeg
        run: |
          echo "FFmpeg:"
          command -v ffmpeg
          ffmpeg -version | head -n 1
          echo "FFprobe:"
          command -v ffprobe
          ffprobe -version | head -n 1

      - name: Generate playlist
        run: pipenv run dev

      - name: Check generated user result
        run: |
          echo "Checking configured result files..."

          test -s output/user_result.txt || {
            echo "::error::output/user_result.txt was not generated or is empty."
            echo "Files currently under output/:"
            find output -maxdepth 4 -type f -printf '%p (%s bytes)\n' | sort || true
            exit 1
          }

          test -s output/user_result.m3u || {
            echo "::error::output/user_result.m3u was not generated or is empty."
            echo "The configuration requires open_m3u_result = True."
            echo "Files currently under output/:"
            find output -maxdepth 4 -type f -printf '%p (%s bytes)\n' | sort || true
            exit 1
          }

          echo "Generated result files:"
          ls -lh output/user_result.txt output/user_result.m3u

      - name: Commit user_result files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # output/ is ignored by .gitignore, so force-add these two files.
          git add -f output/user_result.txt output/user_result.m3u

          if git diff --cached --quiet; then
            echo "No changes to user_result.txt/user_result.m3u."
            exit 0
          fi

          git commit -m "chore: update IPTV playlist"
          git push
