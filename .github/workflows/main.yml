name: Generate IPTV playlist

on:
  # GitHub Actions cron uses UTC. 18:00 UTC = 02:00 Asia/Shanghai on the next day.
  # Runs every Tuesday and Friday at 02:00 Asia/Shanghai.
  schedule:
    - cron: "0 18 * * 1,4"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: iptv-playlist-${{ github.repository }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout source and configuration
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # Keep the upstream project's special Guovin/gd behavior unchanged.
      - name: Load upstream configuration
        if: github.repository_owner == 'Guovin'
        run: |
          git fetch --depth=1 origin gd
          git archive FETCH_HEAD config | tar -x

      - name: Record source revision and cache key
        id: source
        env:
          CONFIG_HASH: ${{ hashFiles('config/**/*.ini', 'config/**/*.txt', 'config/**/*.m3u') }}
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "state_prefix=playlist-state-v1-${RUNNER_OS}-${CONFIG_HASH}-" >> "$GITHUB_OUTPUT"
          echo "state_key=playlist-state-v1-${RUNNER_OS}-${CONFIG_HASH}-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"

          mkdir -p "$RUNNER_TEMP/iptv-config-before"
          cp -a config/. "$RUNNER_TEMP/iptv-config-before/"

      # Generated output is intentionally not restored from Git.
      - name: Remove generated output
        run: rm -rf -- output release-assets

      # Preserve the project's historical cache/frozen state between runs.
      - name: Restore result history
        id: restore-state
        uses: actions/cache/restore@v4
        with:
          path: |
            output/data/cache.gz
            output/data/frozen.gz
          key: ${{ steps.source.outputs.state_key }}
          restore-keys: ${{ steps.source.outputs.state_prefix }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          update-environment: true
          cache: pipenv

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Verify FFmpeg
        run: |
          echo "FFmpeg:"
          command -v ffmpeg
          ffmpeg -version | head -n 1
          echo "FFprobe:"
          command -v ffprobe
          ffprobe -version | head -n 1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip pipenv
          pipenv --python 3.14
          pipenv install --deploy


      - name: Check subscription sources (async, read-only)
        env:
          SOURCE_CONCURRENCY: "24"
          SOURCE_TOTAL_TIMEOUT: "6"
        run: |
          set -euo pipefail
          python - <<'PY'
          import asyncio
          import os
          import urllib.request
          from pathlib import Path

          SOURCE_CONCURRENCY = int(os.environ["SOURCE_CONCURRENCY"])
          SOURCE_TIMEOUT = float(os.environ["SOURCE_TOTAL_TIMEOUT"])
          SOURCE_FILE = Path("config/subscribe.txt")

          urls = []
          seen = set()
          for raw in SOURCE_FILE.read_text(encoding="utf-8").splitlines():
              url = raw.strip()
              if (
                  url
                  and not url.startswith("#")
                  and url.startswith(("http://", "https://"))
                  and url not in seen
              ):
                  seen.add(url)
                  urls.append(url)

          async def check(url):
              try:
                  # urllib runs in a bounded thread pool to stay compatible with
                  # the project's existing Python environment.
                  def fetch():
                      request = urllib.request.Request(
                          url,
                          headers={"User-Agent": "Mozilla/5.0 IPTV-Source-Check"},
                          method="GET",
                      )
                      with urllib.request.urlopen(request, timeout=SOURCE_TIMEOUT) as response:
                          data = response.read(4096)
                          return response.status, len(data)

                  status, size = await asyncio.wait_for(
                      asyncio.to_thread(fetch),
                      timeout=SOURCE_TIMEOUT,
                  )
                  return url, status, size, None
              except Exception as exc:
                  return url, None, 0, str(exc)

          async def main():
              semaphore = asyncio.Semaphore(SOURCE_CONCURRENCY)

              async def bounded(url):
                  async with semaphore:
                      return await check(url)

              results = await asyncio.gather(*(bounded(url) for url in urls))
              reachable = sum(1 for _, status, size, _ in results if status and size > 0)

              for url, status, size, error in results:
                  if status and size > 0:
                      print(f"OK [{status}, {size} bytes] {url}")
                  else:
                      print(f"UNAVAILABLE [{error or 'empty response'}] {url}")

              print(
                  f"Checked: {len(urls)} | reachable: {reachable} | "
                  f"unavailable: {len(urls) - reachable}"
              )
              print("Read-only check: config/subscribe.txt was NOT modified.")

          asyncio.run(main())
          PY

      - name: Generate playlist
        env:
          # Used by the project's public URL / release integration when applicable.
          IPTV_API_ARTIFACT_BASE_URL: https://github.com/${{ github.repository }}/releases/download/playlist-latest
        run: pipenv run dev

      - name: Resolve and validate configured result
        id: result
        shell: bash
        run: |
          set -euo pipefail

          eval "$(
            pipenv run python - <<'PY'
          from pathlib import Path
          from utils.config import config

          final_file = Path(config.final_file)
          final_path = final_file if final_file.is_absolute() else Path.cwd() / final_file
          print(f"FINAL_FILE={str(final_file)!r}")
          print(f"M3U_ENABLED={str(config.open_m3u_result).lower()!r}")
          print(f"FINAL_PATH={str(final_path)!r}")
          print(f"M3U_PATH={str(final_path.with_suffix('.m3u'))!r}")
          PY
          )"

          echo "Configured final_file: $FINAL_FILE"
          echo "Resolved TXT: $FINAL_PATH"
          echo "Resolved M3U: $M3U_PATH"
          echo "open_m3u_result: $M3U_ENABLED"

          show_output_files() {
            echo "Actual output files:"
            find output -maxdepth 5 -type f -printf '%p (%s bytes)\n' | sort || true
          }

          if [[ ! -s "$FINAL_PATH" ]]; then
            echo "::error::Configured TXT result was not generated or is empty: $FINAL_PATH"
            show_output_files
            exit 1
          fi

          if [[ "$M3U_ENABLED" == "true" && ! -s "$M3U_PATH" ]]; then
            echo "::error::M3U result was not generated or is empty: $M3U_PATH"
            echo "open_m3u_result is enabled, so the corresponding M3U file is required."
            show_output_files
            exit 1
          fi

          echo "final_file=$FINAL_PATH" >> "$GITHUB_OUTPUT"
          echo "m3u_file=$M3U_PATH" >> "$GITHUB_OUTPUT"
          echo "m3u_enabled=$M3U_ENABLED" >> "$GITHUB_OUTPUT"

          echo "Generated result files:"
          ls -lh "$FINAL_PATH"
          if [[ "$M3U_ENABLED" == "true" ]]; then
            ls -lh "$M3U_PATH"
          fi

      # Keep the original project's rolling release publishing feature.
      - name: Prepare public release assets
        id: assets
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail

          FINAL_FILE="${{ steps.result.outputs.final_file }}"
          pipenv run python scripts/publish_results.py \
            --final-file "$FINAL_FILE" \
            --destination release-assets

          echo "Release assets:"
          find release-assets -maxdepth 1 -type f -printf '%f (%s bytes)\n' | sort

      - name: Report configuration changes
        run: |
          if ! diff -qr "$RUNNER_TEMP/iptv-config-before" config >/dev/null; then
            echo "::warning::The update changed files under config/. These changes are not committed by this workflow."
            {
              echo "### Configuration notice"
              echo
              echo "The update changed files under \`config/\`."
              echo "Subscription-source changes are committed; other configuration changes are not."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish rolling playlist release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: playlist-latest
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail

          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$SOURCE_SHA" \
              --title "Latest generated playlist" \
              --notes "Rolling, automatically generated IPTV results. Assets are replaced by each successful run." \
              --prerelease
          fi

          mapfile -d '' local_assets < <(
            find release-assets -maxdepth 1 -type f -print0 | sort -z
          )

          if (( ${#local_assets[@]} == 0 )); then
            echo "::error::No release assets were prepared."
            exit 1
          fi

          gh release upload "$RELEASE_TAG" "${local_assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

          mapfile -t remote_assets < <(
            gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json assets \
              --jq '.assets[].name'
          )

          for asset in "${remote_assets[@]}"; do
            if [[ ! -f "release-assets/$asset" ]]; then
              gh release delete-asset "$RELEASE_TAG" "$asset" \
                --repo "$GITHUB_REPOSITORY" \
                --yes
            fi
          done

          find release-assets -maxdepth 1 -type f -printf '%f\n' | sort > /tmp/local-assets.txt
          gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[].name' | sort > /tmp/remote-assets.txt

          diff -u /tmp/local-assets.txt /tmp/remote-assets.txt

      - name: Check source Git revision
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      # The original project stores reusable historical state outside Git.
      - name: Detect reusable result state
        id: result-state
        run: |
          if [[ -f output/data/cache.gz || -f output/data/frozen.gz ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save result history
        if: steps.result-state.outputs.available == 'true' && steps.restore-state.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            output/data/cache.gz
            output/data/frozen.gz
          key: ${{ steps.source.outputs.state_key }}

      # New requirement: commit only the generated user result files.
      # Do not use "git add *", because output/ is intentionally ignored.
      - name: Commit generated playlist to Git
        env:
          FINAL_FILE: ${{ steps.result.outputs.final_file }}
          M3U_FILE: ${{ steps.result.outputs.m3u_file }}
          M3U_ENABLED: ${{ steps.result.outputs.m3u_enabled }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f "$FINAL_FILE"

          if [[ "$M3U_ENABLED" == "true" ]]; then
            git add -f "$M3U_FILE"
          fi

          if git diff --cached --quiet; then
            echo "No changes to generated playlist files."
            exit 0
          fi

          git commit -m "chore: update IPTV playlist"

          # The remote branch may have advanced since checkout (for example,
          # a previous Actions run or a manual commit). Rebase the generated
          # result commit onto the latest remote before pushing.
          # Retry a few times in case another run pushes at the same time.
          for attempt in 1 2 3; do
            if git push origin HEAD:${GITHUB_REF_NAME}; then
              echo "Generated playlist pushed successfully."
              exit 0
            fi

            echo "Push rejected; synchronizing with origin/${GITHUB_REF_NAME} (attempt ${attempt}/3)."
            git fetch origin "${GITHUB_REF_NAME}"

            if ! git rebase "origin/${GITHUB_REF_NAME}"; then
              echo "Rebase conflict detected in generated result files; keeping this run's generated results."
              git checkout --theirs -- "$FINAL_FILE"
              if [[ "$M3U_ENABLED" == "true" ]]; then
                git checkout --theirs -- "$M3U_FILE"
              fi
              git add -f "$FINAL_FILE"
              if [[ "$M3U_ENABLED" == "true" ]]; then
                git add -f "$M3U_FILE"
              fi
              GIT_EDITOR=true git rebase --continue
            fi
          done

          echo "::error::Unable to push generated playlist after 3 attempts."
          exit 1

      - name: Add run summary
        env:
          RELEASE_BASE: https://github.com/${{ github.repository }}/releases/download/playlist-latest
          FINAL_FILE: ${{ steps.result.outputs.final_file }}
          M3U_FILE: ${{ steps.result.outputs.m3u_file }}
          M3U_ENABLED: ${{ steps.result.outputs.m3u_enabled }}
        run: |
          {
            echo "### IPTV playlist generation"
            echo
            echo "- TXT: \`$FINAL_FILE\`"
            if [[ "$M3U_ENABLED" == "true" ]]; then
              echo "- M3U: \`$M3U_FILE\`"
            fi
            echo "- Release: $RELEASE_BASE"
            echo "- Schedule: every Tuesday and Friday at 02:00 Asia/Shanghai"
          } >> "$GITHUB_STEP_SUMMARY"
